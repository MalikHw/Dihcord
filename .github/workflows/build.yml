name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  helper:
    name: Discord RPC app APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Fetch the Discord SDK
        uses: actions/checkout@v5
        with:
          repository: MalikHw/discord-sdk
          token: ${{ secrets.DISCORD_SDK_TOKEN }}
          path: discord-sdk
          persist-credentials: false

      - name: Install the Discord SDK
        run: |
          7z e -y discord-sdk/discord_partner_sdk.zip '*.aar' -oandroid/app/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check for the Discord SDK
        run: test -f android/app/libs/discord_partner_sdk.aar || (echo "android/app/libs/discord_partner_sdk.aar is missing" && exit 1)

      - name: Decode release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Ensure debug keystore exists for fallback signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 == ''
        run: |
          KEYSTORE_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/.android"
          mkdir -p "$KEYSTORE_DIR"
          test -f "$KEYSTORE_DIR/debug.keystore" || keytool -genkeypair -v \
            -keystore "$KEYSTORE_DIR/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk gd-discord-rpc.apk
        
      - name: Diagnose APK
        run: |
          SDK="$ANDROID_HOME/build-tools"
          APK="gd-discord-rpc.apk"
          find "$SDK" -name aapt -type f | head -1
          find "$SDK" -name apksigner -type f | head -1
          AAPT=$(find "$SDK" -name aapt -type f | head -1)
          SIGNER=$(find "$SDK" -name apksigner -type f | head -1)
          "$AAPT" dump permissions "$APK"
          "$SIGNER" verify --print-certs "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v5
        with:
          name: helper-apk
          path: gd-discord-rpc.apk

  build:
    needs: ['helper']
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Get the helper APK
        uses: actions/download-artifact@v5
        with:
          name: helper-apk
          path: resources

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v5
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}